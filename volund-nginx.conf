server {
    listen 80;
    listen [::]:80;
    server_name volund.local;
    
    root /var/www/volund;
    index volund.html index.html;
    
    # Logs
    access_log /var/log/nginx/volund-access.log;
    error_log /var/log/nginx/volund-error.log;
    
    # Charset
    charset utf-8;
    
    # Désactiver le listing des répertoires
    autoindex off;
    
    # Taille max des uploads
    client_max_body_size 10M;
    
    # PHP-FPM configuration pour PHP 8.4
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Timeouts
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
    
    # Routes API - toutes les requêtes /api/* vers api.php
    location ^~ /api/ {
        try_files $uri $uri/ /api.php?$query_string;
    }
    
    # Routes Preseed - accès public aux fichiers preseed
    location ^~ /preseed/ {
        try_files $uri /api.php?$query_string;
    }
    
    # Routes Themes - servir les fichiers CSS
    location ^~ /themes/ {
        alias /var/www/volund/themes/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Routes Script - servir les scripts via serve_script.php
    location ^~ /script/ {
        rewrite ^/script/(.+\.sh)$ /serve_script.php?s=$1 last;
    }
    
    # Protection du répertoire preseeds - pas d'accès direct
    location ^~ /preseeds/ {
        deny all;
        return 403;
    }
    
    # Protection des fichiers de configuration
    location ~ /volund_config\.json$ {
        deny all;
        return 403;
    }
    
    location ~ /\.ht {
        deny all;
        return 403;
    }
    
    # Fichiers statiques avec cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Page principale
    location / {
        try_files $uri $uri/ /volund.html;
    }
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}


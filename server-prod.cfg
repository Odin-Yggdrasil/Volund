# Configuration Preseed - Serveur Production Debian 12
# Généré par VOLUND
# Installation automatisée pour serveur standard

#### Localisation
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/toggle select No toggling

#### Configuration réseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# Désactiver le message d'avertissement de clé WEP faible
d-i netcfg/wireless_wep_weak boolean true

#### Miroir Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm

#### Comptes utilisateurs
# Activer le compte root
d-i passwd/root-login boolean true
# Mot de passe root (à changer!)
d-i passwd/root-password password ChangeMe123!
d-i passwd/root-password-again password ChangeMe123!

# Créer un utilisateur normal
d-i passwd/user-fullname string Administrateur Système
d-i passwd/username string admin
d-i passwd/user-password password ChangeMe123!
d-i passwd/user-password-again password ChangeMe123!
d-i passwd/user-default-groups string sudo,adm,cdrom,dip,plugdev

#### Horloge et fuseau horaire
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string fr.pool.ntp.org

#### Partitionnement
# Utiliser LVM
d-i partman-auto/method string lvm

# Supprimer les anciennes config LVM
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Taille du volume LVM
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string vg0

# Schéma de partitionnement : tout en une partition
d-i partman-auto/choose_recipe select atomic

# Confirmer le partitionnement
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### APT Configuration
# Ne pas scanner de CD
d-i apt-setup/cdrom/set-first boolean false
# Utiliser les dépôts réseau
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

#### Sélection des paquets
# Tâches à installer
tasksel tasksel/first multiselect standard, ssh-server

# Paquets additionnels
d-i pkgsel/include string \
    vim \
    curl \
    wget \
    git \
    htop \
    sudo \
    ufw \
    fail2ban \
    apt-transport-https \
    ca-certificates \
    gnupg \
    lsb-release \
    rsync \
    screen \
    tmux \
    net-tools \
    dnsutils \
    ntp

# Mettre à jour tous les paquets après installation
d-i pkgsel/upgrade select full-upgrade

# Participation au concours de popularité
popularity-contest popularity-contest/participate boolean false

#### Configuration GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### Finalisation
# Éviter le message "Installation terminée"
d-i finish-install/reboot_in_progress note

# Ne pas éjecter le CD
d-i cdrom-detect/eject boolean false

# Redémarrer automatiquement
d-i debian-installer/exit/poweroff boolean false

#### Post-installation (optionnel)
# Exécuter des commandes après l'installation
d-i preseed/late_command string \
    in-target apt-get update; \
    in-target apt-get install -y openssh-server; \
    in-target systemctl enable ssh; \
    in-target ufw --force enable; \
    in-target ufw allow ssh
